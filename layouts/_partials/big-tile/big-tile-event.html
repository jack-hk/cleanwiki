<article
  class="big-tile__item big-tile__item--event"
  style="background-image: url('{{ .page.Params.image }}')">
  <a href="{{ .page.RelPermalink }}" class="big-tile__link">
    <span class="big-tile__category">{{ .category }}</span>

    <div class="big-tile__overlay">
      <div class="big-tile__content">
        <h3 class="big-tile__title">{{ .page.Title }}</h3>
        <p class="big-tile__excerpt">
          {{- .page.Summary | plainify | truncate .truncate -}}
        </p>
        <div class="event-meta">
          <span class="event-date"
            >📅 {{ .page.Params.eventDate | default "TBD" }}</span
          >
          <span class="event-time"
            >⏰ {{ .page.Params.eventTime | default "TBD" }}</span
          >
        </div>
      </div>
    </div>
  </a>
</article>
