<div id="search"></div>

<script>
  window.pagefindConfig = {
    initialPageSize: {{ site.Params.pagefind.initialPageSize | default 5 }},
    loadMoreCount: {{ site.Params.pagefind.loadMoreCount | default 5 }},
    showSubResults: {{ site.Params.pagefind.showSubResults | default true }},
    showImages: {{ site.Params.pagefind.showImages | default true }},
    debounceTimeoutMs: {{ site.Params.pagefind.debounceTimeoutMs | default 300 }},
    excerptLength: {{ site.Params.pagefind.excerptLength | default 30 }},
    thumbnailSources: {
      primary: "{{ site.Params.pagefind.thumbnailSources.primary | default "image" }}",
      fallback1: "{{ site.Params.pagefind.thumbnailSources.fallback1 | default "thumbnail" }}",
      fallback2: "{{ site.Params.pagefind.thumbnailSources.fallback2 | default "featured" }}"
    },
    placeholderImage: "{{ site.Params.pagefind.placeholderImage }}",
    thumbnailFallbacks: {{ site.Params.thumbnailFallbacks | jsonify | safeJS }}
  };

  console.log('Search bar script loaded, config:', window.pagefindConfig);

  // Initialize search when PageFind and CustomPagefind are both ready
  function initializeSearch() {
    console.log('Attempting to initialize search. CustomPagefind available?', !!window.CustomPagefind);
    if (window.CustomPagefind) {
      console.log('Initializing CustomPagefind');
      const instance = new window.CustomPagefind(window.pagefindConfig);
      console.log('CustomPagefind instance created:', instance);
      return true;
    }
    return false;
  }

  if (!initializeSearch()) {
    // Wait for CustomPagefind to be loaded
    let attempts = 0;
    const checkPageFind = setInterval(() => {
      attempts++;
      console.log('Waiting for CustomPagefind... attempt', attempts);
      if (initializeSearch()) {
        clearInterval(checkPageFind);
      }
      if (attempts > 50) {
        clearInterval(checkPageFind);
        console.error('CustomPagefind not loaded after 5 seconds');
      }
    }, 100);
  }
</script>
