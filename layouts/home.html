{{ define "main" }}
  <span class="home-header">
    <div class="home-header__circle "></div>
    <h1 class="home-header__title">{{ site.Title }}</h1>
    <h3 class="home-header__subtitle">
      {{ site.Params.subtitle }}
    </h3>
  </span>
  {{ partial "small-tile.html" . }}
  {{ partial "lined-section.html" "Featured" }}
  {{ partial "big-tile.html" . }}
  {{ partial "lined-section.html" "About us" }}
  <div class="home__about-us">{{ .Content }}</div>
{{ end }}
