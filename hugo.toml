# ---------------------------
# Site settings
# ---------------------------
baseURL = "https://golden-wastes.pages.dev/"
languageCode = "en-US"
title = "My New Hugo Site"

# ---------------------------
# Menus
# ---------------------------
[menus]

# Main menu
[[menus.main]]
name = "Home"
pre = "house"
pageRef = "/"
weight = 10
  [menus.main.params]
  separator = true

# ---------------------------
# Hugo module settings
# ---------------------------
[module]
  [module.hugoVersion]
    extended = false
    min = "0.146.0"

# ---------------------------
# Custom site parameters
# ---------------------------
[params]
enablePagefindCSS = false
subtitle = "This site is my site, there are many like it, but this one is mine."

[params.pagefind]
  initialPageSize = 5
  loadMoreCount = 5
  showSubResults = true
  showImages = true
  fitThumbnails = false
  debounceTimeoutMs = 300
  excerptLength = 30

  [params.pagefind.thumbnailSources]
    primary = "featured"
    fallback1 = "thumbnail"
    fallback2 = "placeholder"

  placeholderImage = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Crect fill='%23e5e7eb' width='400' height='400'/%3E%3Ctext x='50%25' y='50%25' font-size='24' fill='%23999' text-anchor='middle' dy='.3em'%3ENo Image%3C/text%3E%3C/svg%3E"

# ---------------------------
# Page layout settings
# ---------------------------
[params.pageLayout]
showHeader = true
showMeta = true
showTaxonomies = true
showFeaturedImage = true
showSeries = true
showUpdated = true
showReferences = true
showTaxonomyIcons = true
showReadingTime = false
metaBelowContent = false
taxonomiesBelowContent = false

[params.wiki]
show_date = false

# ---------------------------
# Breadcrumbs configuration
# ---------------------------
[params.breadcrumbs]
enabled = true
separator = "/"

# ---------------------------
# Navbar configuration
# ---------------------------
[params.navbarBar]
iconsHaveLabels = false
iconSeparator = true

# ---------------------------
# Small tiles settings
# ---------------------------
[params.smallTiles]
type = "categories"

# Images to use for each small tile
[params.smallTiles.images]
lore = "https://picsum.photos/id/1011/400/300"
asd     = "https://picsum.photos/id/1012/400/300"
asd2    = "https://picsum.photos/id/1013/400/300"
asd3    = "https://picsum.photos/id/1015/400/300"
da      = "https://picsum.photos/id/1016/400/300"
event   = "https://i.pinimg.com/736x/44/c5/d9/44c5d9c1f3b3d7725ffc7e3efbe45d5e.jpg"
quote   = "https://imgs.search.brave.com/S9luD9l2ZNLz7C1F9ZViGkFPVLBL0qSV3xaCBuG5Rzc/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93d3cu/bWluZWNyYWZ0Lm5l/dC9jb250ZW50L2Rh/bS9taW5lY3JhZnRu/ZXQvZ2FtZXMvbWlu/ZWNyYWZ0L2tleS1h/cnQvTmV3X0tleS1B/cnRfMDYuanBn"
sup     = "https://picsum.photos/id/1020/400/300"

# ---------------------------
# Big tiles settings
# ---------------------------
[params.bigTiles]
count = 3
truncate = 150
pages = [
  "/lore/the-project",
  "/campaign/how-to-play",
  "/lore/the-wastes",
]

# Map categories to partial HTML files for rendering each big tile
[params.bigTiles.partials]
"lore" = "big-tile-lore.html"
"quote"   = "big-tile-quote.html"
"event"   = "big-tile-event.html"

# ---------------------------
# Timeline settings
# ---------------------------
[params.timeline]
enabled = true
title = "Timeline"
minimumItems = 2
placement = "alternate" # alternate, top, or bottom
itemMinWidth = "180px"
alternateCardWidth = "180px"
itemGap = "1rem"
trackMinHeight = "340px"
bottomMargin = "0"

[params.timeline.mobile]
layout = "vertical" # vertical or horizontal
side = "left" # left, right, or center (used by the vertical layout)
bottomMargin = "0"
itemMinWidth = "180px"
itemGap = "1rem"
trackMinHeight = "340px"

[params.timeline.scrollbar]
styled = false
showButtons = false
showRightHint = false

[params.timeline.increments]
enabled = false

# Ordered increment markers use an `after` post number and a Markdown label:
# [[params.timeline.increments.items]]
# after = 1
# label = "An increment"
# placement = "top" # top or bottom

[params.timeline.thumbnails]
enabled = true
usePageImage = false
enabledOnMobile = true
size = "112px"
minSize = "72px"
maxSize = "160px"
mobileSize = "96px"
mobileMinSize = "64px"
mobileMaxSize = "128px"
height = "auto"
objectFit = "cover"
objectPosition = "center"
borderRadius = "4px"

# Add ordered [[params.timeline.entries]] tables in the site configuration.
# Each entry supports pageRef, anchor, title, description (Markdown), thumbnail,
# thumbnailAlt, thumbnailEnabled, and thumbnailSize.

# ---------------------------
# Interactive map settings
# ---------------------------
[params.interactiveMap]
enabled = false
title = "Explore the map"
description = ""
image = ""
imageAlt = "Interactive map"
imageWidth = 1536
imageHeight = 1024
height = "520px"
minZoom = -2
maxZoom = 2
initialZoom = "fit"
zoomControl = true
scrollWheelZoom = false
dragging = true
attribution = ""
ariaLabel = "Interactive map"

[params.interactiveMap.mobile]
show = true
height = "360px"
clickToActivate = false
gateOnTablet = false
activateLabel = "Click to see map"
hideLabel = "Hide map"

# Add ordered [[params.interactiveMap.markers]] tables in the site config.
# Marker x/y values are percentages measured from the image's top-left corner.
# Each marker supports title, Markdown description, x, y, url, pageRef, and linkLabel.

[params.portal]
  showcase_tiles = 3
  min_showcase_tiles = 3
  show_layout_toggle = true
  default_list_layout = "fixed"
  show_intro_text = true
  intro_text = "Browse all lore related to {title} in the {taxonomy} taxonomy."
  show_left_textbox = true
  left_textbox_title = "About This Category"
  left_textbox_text = "You're viewing all lore entries tagged under {title}."
  show_right_textbox = true
  right_textbox_title = "Get Involved"
  right_textbox_text = "Contribute your own lore or suggest related topics to enrich this section."
  show_bottom_textbox = true
  bottom_textbox_text = "Lorem Ipsum is simply dummy text of the printing and typesetting industry."
  show_alphabet = true
  truncate_limit = 180

[params.portalCard]
  card_count = 3
  min_card_count = 3
  random_cards = true
  cards = []
  truncate_limit = 100
  carousel_on_desktop = false
  show_intro_text = true
  intro_text = "Choose your path. Each class offers unique abilities and playstyles in the brutal world of Golden Wastes."
  show_bottom_textbox = true
  bottom_textbox_text = "The cards have spoken. Choose your path wisely."
