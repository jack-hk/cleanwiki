# ---------------------------
# Site settings
# ---------------------------
baseURL = "https://example.org/"
languageCode = "en-US"
title = "My New Hugo Site"

# ---------------------------
# Menus
# ---------------------------
[menus]

# Main menu
[[menus.main]]
name = "Home"
pre = "house"
pageRef = "/"
weight = 10
  [menus.main.params]
  separator = true

# ---------------------------
# Hugo module settings
# ---------------------------
[module]
  [module.hugoVersion]
    extended = false
    min = "0.146.0"

# ---------------------------
# Custom site parameters
# ---------------------------
[params]
enablePagefindCSS = false
subtitle = "This site is my site, there are many like it, but this one is mine."

[params.pagefind]
  initialPageSize = 5
  loadMoreCount = 5
  showSubResults = true
  showImages = true
  debounceTimeoutMs = 300
  excerptLength = 30

  [params.pagefind.thumbnailSources]
    primary = "featured"
    fallback1 = "thumbnail"
    fallback2 = "placeholder"

  placeholderImage = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Crect fill='%23e5e7eb' width='400' height='400'/%3E%3Ctext x='50%25' y='50%25' font-size='24' fill='%23999' text-anchor='middle' dy='.3em'%3ENo Image%3C/text%3E%3C/svg%3E"

# ---------------------------
# Page layout settings
# ---------------------------
[params.pageLayout]
showHeader = true
showMeta = true
showTaxonomies = true
showFeaturedImage = true
showSeries = true
showUpdated = true
showReferences = true
showTaxonomyIcons = true
metaBelowContent = false
taxonomiesBelowContent = false

# ---------------------------
# Breadcrumbs configuration
# ---------------------------
[params.breadcrumbs]
enabled = true
separator = "/"

# ---------------------------
# Navbar configuration
# ---------------------------
[params.navbarBar]
iconsHaveLabels = false
iconSeparator = true

# ---------------------------
# Small tiles settings
# ---------------------------
[params.smallTiles]
type = "categories"

# Images to use for each small tile
[params.smallTiles.images]
article = "https://picsum.photos/id/1011/400/300"
asd     = "https://picsum.photos/id/1012/400/300"
asd2    = "https://picsum.photos/id/1013/400/300"
asd3    = "https://picsum.photos/id/1015/400/300"
da      = "https://picsum.photos/id/1016/400/300"
event   = "https://i.pinimg.com/736x/44/c5/d9/44c5d9c1f3b3d7725ffc7e3efbe45d5e.jpg"
quote   = "https://imgs.search.brave.com/S9luD9l2ZNLz7C1F9ZViGkFPVLBL0qSV3xaCBuG5Rzc/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93d3cu/bWluZWNyYWZ0Lm5l/dC9jb250ZW50L2Rh/bS9taW5lY3JhZnRu/ZXQvZ2FtZXMvbWlu/ZWNyYWZ0L2tleS1h/cnQvTmV3X0tleS1B/cnRfMDYuanBn"
sup     = "https://picsum.photos/id/1020/400/300"

# ---------------------------
# Big tiles settings
# ---------------------------
[params.bigTiles]
count = 3
truncate = 150

# Map categories to partial HTML files for rendering each big tile
[params.bigTiles.partials]
"article" = "big-tile-article.html"
"quote"   = "big-tile-quote.html"
"event"   = "big-tile-event.html"

[params.portal]
  showcase_tiles = 3
  min_showcase_tiles = 3
  show_layout_toggle = true
  default_list_layout = "fixed"
  show_left_textbox = true
  left_textbox_title = "About This Category"
  left_textbox_text = "You're viewing all articles tagged under {title}."
  show_right_textbox = true
  right_textbox_title = "Get Involved"
  right_textbox_text = "Contribute your own articles or suggest related topics to enrich this section."
  show_bottom_textbox = true
  bottom_textbox_text = "Lorem Ipsum is simply dummy text of the printing and typesetting industry."
  show_alphabet = true
  truncate_limit = 180
